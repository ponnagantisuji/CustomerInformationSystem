apiVersion: v1
kind: Namespace
metadata:
  name: suji-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerinformationsystem-deployment
  namespace: suji-ns          # <-- Added namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customerinformationsystem
  template:
    metadata:
      labels:
        app: customerinformationsystem
    spec:
      containers:
        - name: customerinformationsystem
          image: customerinformationsystem:1.0-snapshot
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9095
---
apiVersion: v1
kind: Service
metadata:
  name: customerinformationsystem-service
  namespace: suji-ns          # <-- Added namespace
spec:
  type: NodePort
  selector:
    app: customerinformationsystem
  ports:
    - protocol: TCP
      port: 9091
      targetPort: 9091
      nodePort: 30089
